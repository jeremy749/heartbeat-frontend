name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app lives in a subdirectory; every step runs from there.
defaults:
  run:
    working-directory: heartbeat-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heartbeat-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: heartbeat-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
